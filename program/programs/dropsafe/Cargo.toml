[package]
name = "dropsafe"
version = "0.1.0"
description = "DropSafe: on-chain group-buying escrow"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dropsafe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Devnet 演示专用:申诉期缩短到 60 秒,方便录视频和跑测试
devnet-demo = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
